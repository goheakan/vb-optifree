# Banc d'essai. Il ne monte aucun dossier de la machine (ni ~/.config, ni un
# service Ollama). Le port publié sur l'hôte est 127.0.0.1:4000.
#
# LiteLLM écoute 0.0.0.0 dans son espace réseau parce que le relais Docker
# n'atteint pas une écoute limitée à 127.0.0.1. La publication hôte reste
# 127.0.0.1, donc le LAN ne voit pas le port. OpenCode partage cet espace
# réseau et parle à LiteLLM en http://127.0.0.1:4000.
#
# Les hops cloud du fichier de test vont vers le service mock, jamais vers
# Internet. Le mock n'a pas de port publié.
#
# Images épinglées le 2026-11-11 (linux/amd64) :
#   ghcr.io/berriai/litellm-non_root:v1.108.5
#   node:22-bookworm
#   opencode-ai 1.19.5, construit par docker/Dockerfile.opencode

name: vb-optifree-test

services:
  mock:
    image: node@sha256:539d4d5b9c0df96bb9d1229264d358dc816e8592cb8867828a580b527e7ad0fa
    command: ["node", "/opt/mock/mock_upstream.mjs"]
    env_file:
      - run/.env
    volumes:
      - ./mock_upstream.mjs:/opt/mock/mock_upstream.mjs:ro
    mem_limit: 256m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  litellm:
    image: ghcr.io/berriai/litellm-non_root@sha256:c83beb208285cee441c29abda606f572c40971156ef4f0880ff2bca301b94448
    depends_on:
      - mock
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - run/.env
    volumes:
      - ./litellm.test.yaml:/app/config.yaml:ro
    command:
      - --config
      - /app/config.yaml
      - --host
      - 0.0.0.0
      - --port
      - "4000"
    mem_limit: 2g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  opencode:
    profiles: ["opencode"]
    image: vb-optifree-opencode:1.19.5
    build:
      context: .
      dockerfile: Dockerfile.opencode
    network_mode: service:litellm
    env_file:
      - run/opencode.env
    mem_limit: 2g
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
