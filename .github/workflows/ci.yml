name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          additional_files: install.sh doctor.sh

  plugin:
    name: Plugin (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22"]
    defaults:
      run:
        working-directory: opencode-quota
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: opencode-quota/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pii:
    name: PII scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse les chemins personnels et identifiants de session
        run: |
          if grep -RInE 'ses_[A-Za-z0-9]{10,}|/home/[a-z][a-z0-9_-]*/' \
            --exclude-dir=.git --exclude-dir=node_modules .; then
            echo "::error::PII potentielle détectée (chemin personnel ou session ID)"
            exit 1
          fi
