# vb-optifree — configuration LiteLLM
# Documentation : https://docs.litellm.ai/docs/proxy/configs
#
# Les identifiants de modèles doivent être ajustés à la version de LiteLLM et
# aux modèles gratuits disponibles au moment de l'installation.

model_list:
  # Ollama n'est pas dans le chemin courant. Les entrées locales restent
  # commentées pour que la passerelle démarre sans rien sur le port 11434.
  # Elles reviendront avec l'alias sensitive, qui ne doit jamais partir
  # vers un cloud gratuit.
  # - model_name: local-coder
  #   litellm_params:
  #     model: ollama/qwen2.5-coder:14b
  #     api_base: http://127.0.0.1:11434
  # - model_name: local-fast
  #   litellm_params:
  #     model: ollama/qwen2.5-coder:7b
  #     api_base: http://127.0.0.1:11434

  # --- Cloud gratuit (non sensible) ---
  - model_name: groq-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
  # OpenRouter n'est pas dans la chaîne active. Un identifiant non résolu
  # enverrait quand même le prompt et la clé. Décommente seulement après
  # avoir remplacé le modèle par un identifiant :free réel.
  # - model_name: openrouter-free
  #   litellm_params:
  #     model: openrouter/<provider>/<model>:free
  #     api_key: os.environ/OPENROUTER_API_KEY

  # Payant. L'ordre par défaut le place avant Gemini.
  - model_name: deepseek-flash
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 60
  allowed_fails: 3
  cooldown_time: 30

  # Alias utilisé par OpenCode quand la session vise LiteLLM.
  # Zen n'est pas un modèle LiteLLM : OpenCode le choisit avant cette passerelle.
  # sensitive reviendra avec Ollama. Il n'a pas d'alias ici, pour qu'un
  # secret ne soit pas renvoyé vers Groq, DeepSeek ou Gemini.
  # Ordre de cette passerelle : Groq, puis DeepSeek, puis Gemini.
  # /quote order réécrit le bloc ci-dessous dans la config installée.
  model_group_alias:
    default: groq-120b

  # Repli sans retour en arrière, dans l'ordre choisi.
  fallbacks:
    - default: ["deepseek-flash", "gemini-flash"]
    - groq-120b: ["deepseek-flash", "gemini-flash"]
    - deepseek-flash: ["gemini-flash"]

litellm_settings:
  turn_off_message_logging: true
  redact_user_api_key_info: true
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_prompts_in_spend_logs: false
  # Clients directs, pas de reverse proxy : ne pas honorer X-Forwarded-For.
  trusted_proxy_ranges: []
  # database_url: os.environ/LITELLM_DATABASE_URL   # optionnel : spend persistant
